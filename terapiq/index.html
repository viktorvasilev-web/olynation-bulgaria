<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Заяви безплатна уелнес терапия и остави своите данни за връзка.">
  <meta name="theme-color" content="#04130f">
  <title>Заяви безплатна уелнес терапия | OlyNation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/start/p90-favicon.png">
  <link rel="stylesheet" href="/terapiq/style.css">
</head>
<body>
  <div class="announcement">МЕСТАТА СА ОГРАНИЧЕНИ!</div>

  <main class="page-shell">
    <a class="brand" href="/" aria-label="OlyNation начало">
      <img src="/start/p90-logo.webp" alt="OlyLife">
    </a>

    <section class="form-card" aria-labelledby="page-title">
      <div class="page-header">
        <h1 id="page-title">Заяви безплатна <span>уелнес терапия</span></h1>
        <p>Остави своите данни и ще се свържем с теб.</p>
      </div>

      <form id="therapy-form" method="post" target="therapy-submit-frame" novalidate>
        <input name="source" type="hidden">
        <input name="partner" type="hidden" value="viktor">
        <div class="honeypot" aria-hidden="true">
          <label for="therapy-website">Уебсайт</label>
          <input id="therapy-website" name="website" type="text" tabindex="-1" autocomplete="off">
        </div>

        <div class="field">
          <label class="sr-only" for="therapy-name">Име</label>
          <input id="therapy-name" name="name" type="text" autocomplete="name" placeholder="Име" required>
        </div>

        <div class="field">
          <label class="sr-only" for="therapy-phone">Телефон</label>
          <input id="therapy-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" pattern="[0-9+() -]{7,20}" placeholder="Телефон" required>
        </div>

        <div class="field">
          <label class="sr-only" for="therapy-email">Имейл</label>
          <input id="therapy-email" name="email" type="email" autocomplete="email" placeholder="Имейл" required>
        </div>

        <label class="consent">
          <input name="consent" type="checkbox" required>
          <span>Съгласен/на съм данните ми да бъдат използвани за връзка с мен относно заявката.</span>
        </label>

        <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
        <button class="submit-button" type="submit"><span class="button-label">Заяви сега <span class="button-arrow" aria-hidden="true">→</span></span></button>
      </form>

    </section>
  </main>

  <iframe class="submit-frame" name="therapy-submit-frame" title="Изпращане на формата"></iframe>
  <footer>© 2026 OlyNation Bulgarian Team</footer>
  <script src="/terapiq/script.js"></script>
</body>
</html>
